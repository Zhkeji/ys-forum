<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理后台 - YS论坛</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter','PingFang SC',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:rgba(255,255,255,0.15);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.2);border-radius:24px;padding:48px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.2)}
.btn-item{display:flex;align-items:center;gap:14px;padding:18px;margin-bottom:14px;border-radius:16px;text-decoration:none;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);transition:0.3s;color:#fff}.btn-item:hover{transform:translateY(-2px);background:rgba(255,255,255,0.2)}
.btn-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px}
.btn-info h3{font-size:16px;font-weight:600}.btn-info span{font-size:13px;color:rgba(255,255,255,0.7)}
</style></head><body>
<div class="card">
  <div style="font-size:48px;margin-bottom:16px">🌸</div>
  <h1 style="font-size:24px;color:#fff;margin-bottom:8px">YS工作室论坛</h1>
  <p style="color:rgba(255,255,255,0.7);margin-bottom:32px">选择管理入口</p>
  <a href="/admin/super/" class="btn-item"><div class="btn-icon" style="background:linear-gradient(135deg,#ff6b8a,#e74c6f)">👑</div><div class="btn-info"><h3>超级管理员</h3><span>完整管理权限</span></div><i class="fa-solid fa-chevron-right" style="margin-left:auto;color:rgba(255,255,255,0.5)"></i></a>
  <a href="/admin/admin/" class="btn-item"><div class="btn-icon" style="background:linear-gradient(135deg,#5e5ce6,#6366f1)">🔧</div><div class="btn-info"><h3>管理员</h3><span>内容管理权限</span></div><i class="fa-solid fa-chevron-right" style="margin-left:auto;color:rgba(255,255,255,0.5)"></i></a>
  <a href="/" style="display:inline-block;margin-top:24px;color:rgba(255,255,255,0.6);font-size:13px;text-decoration:none">← 返回前台</a>
</div></body></html>
