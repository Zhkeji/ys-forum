<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>私信 - YS论坛</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter','PingFang SC',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#f093fb 100%);background-attachment:fixed;min-height:100vh;color:#1e293b}
.glass{background:rgba(255,255,255,0.25);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.18)}
.chat-app{display:flex;height:100vh}.sidebar{width:300px;background:rgba(255,255,255,0.15);backdrop-filter:blur(20px);border-right:1px solid rgba(255,255,255,0.15);display:flex;flex-direction:column}
.sidebar-hdr{padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,0.15)}
.sidebar-hdr h2{font-size:18px;color:#fff}.back-btn{color:#fff;text-decoration:none;font-size:18px}
.conv-list{flex:1;overflow-y:auto}
.conv-item{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.08);transition:0.2s}
.conv-item:hover{background:rgba(255,255,255,0.1)}.conv-item.active{background:rgba(255,255,255,0.15)}
.conv-item img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.2)}
.conv-info{flex:1;min-width:0}.conv-name{font-weight:600;font-size:14px;color:#fff}.conv-msg{font-size:12px;color:rgba(255,255,255,0.6);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv-time{font-size:11px;color:rgba(255,255,255,0.5)}.unread-dot{width:8px;height:8px;background:#ec4899;border-radius:50%}
.chat-main{flex:1;display:flex;flex-direction:column}.chat-hdr{padding:14px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.1)}
.chat-hdr img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.chat-hdr h3{font-size:16px;color:#fff}.chat-hdr .status{font-size:12px;color:rgba(255,255,255,0.6)}
.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;max-width:75%}.msg.sent{align-self:flex-end;flex-direction:row-reverse}
.msg-bubble{padding:10px 14px;border-radius:16px;font-size:14px;word-break:break-word;max-width:100%}
.msg.sent .msg-bubble{background:linear-gradient(135deg,#6366f1,#ec4899);color:#fff;border-bottom-right-radius:4px}
.msg.recv .msg-bubble{background:rgba(255,255,255,0.9);color:#1e293b;border:1px solid rgba(255,255,255,0.3);border-bottom-left-radius:4px}
.msg-time{font-size:10px;color:rgba(255,255,255,0.5);margin-top:3px}
.msg.sent .msg-time{text-align:right}
.msg-input{padding:12px 16px;display:flex;gap:10px;border-top:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.1)}
.msg-input input{flex:1;padding:10px 16px;border:1px solid rgba(255,255,255,0.2);border-radius:20px;background:rgba(255,255,255,0.15);color:#fff;font-size:14px;outline:none}
.msg-input input::placeholder{color:rgba(255,255,255,0.4)}
.msg-input button{width:40px;height:40px;border-radius:50%;border:none;background:linear-gradient(135deg,#6366f1,#ec4899);color:#fff;cursor:pointer;font-size:16px}
.chat-placeholder{flex:1;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.5)}
.date-sep{text-align:center;font-size:11px;color:rgba(255,255,255,0.5);padding:8px 0}
.date-sep span{background:rgba(255,255,255,0.15);padding:3px 12px;border-radius:10px}
@media(max-width:768px){.sidebar{width:100%;position:absolute;top:0;left:0;bottom:0;z-index:10}.sidebar.hidden{display:none}.back-btn{display:block!important}}</style>
</head><body>
<div class="chat-app">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-hdr"><a href="/" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a><h2>💬 私信</h2></div>
    <div class="conv-list" id="convList"></div>
    <div id="convEmpty" style="display:none;padding:40px;text-align:center;color:rgba(255,255,255,0.5)"><p>暂无私信</p></div>
  </div>
  <div class="chat-main">
    <div class="chat-placeholder" id="chatPlaceholder"><div style="text-align:center"><div style="font-size:48px;margin-bottom:12px">💬</div><h3>选择一个会话</h3><p style="font-size:13px">或在帖子详情页发起私信</p></div></div>
    <div id="chatArea" style="display:none;flex:1;flex-direction:column">
      <div class="chat-hdr"><button id="backBtn" style="display:none;background:none;border:none;color:#fff;font-size:18px;cursor:pointer" onclick="backToList()"><i class="fa-solid fa-arrow-left"></i></button><img id="chatAvatar" src="/img/default-avatar.png"><div><h3 id="chatName">-</h3><span class="status" id="chatStatus">离线</span></div></div>
      <div class="messages" id="messages"></div>
      <div class="msg-input"><input id="msgInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter'){event.preventDefault();sendMsg();}"><button onclick="sendMsg()"><i class="fa-solid fa-paper-plane"></i></button></div>
    </div>
  </div>
</div>
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<script>
var API='',TOKEN=localS…tem('token'),USER=null,socket=null,currentConv=null,conversations=[];
if(!TOKEN)location.href='/';
fetchAPI('/api/auth/me').then(function(d){USER=d.user;initSocket();loadConvs();var p=new URLSearchParams(location.search);if(p.get('id'))setTimeout(function(){openConv(p.get('id'));},500);}).catch(function(){localStorage.removeItem('token');location.href='/';});

function initSocket(){
  socket=io({auth:{token:TOKEN},transports:['polling','websocket']});
  socket.on('new_message',function(m){if(currentConv&&m.conversation_id===currentConv.id){appendMsg(m);socket.emit('mark_read',{conversationId:currentConv.id});scrollBottom();}loadConvs();});
  socket.on('user_online',function(d){if(currentConv&&currentConv.other_id===d.userId){document.getElementById('chatStatus').textContent='在线';document.getElementById('chatStatus').style.color='#10b981';}});
  socket.on('user_offline',function(d){if(currentConv&&currentConv.other_id===d.userId){document.getElementById('chatStatus').textContent='离线';document.getElementById('chatStatus').style.color='rgba(255,255,255,0.6)';}});
}

function loadConvs(){
  fetchAPI('/api/chat/conversations').then(function(d){
    conversations=d.conversations;var list=document.getElementById('convList');
    if(!conversations.length){list.innerHTML='';document.getElementById('convEmpty').style.display='flex';return;}
    document.getElementById('convEmpty').style.display='none';
    list.innerHTML=conversations.map(function(c){return '<div class="conv-item'+(currentConv&&currentConv.id===c.id?' active':'')+'" onclick="openConv(\''+c.id+'\')"><img src="'+(c.other_avatar||'/img/default-avatar.png')+'"><div class="conv-info"><div class="conv-name">'+esc(c.other_name||'用户')+'</div><div class="conv-msg">'+esc(c.last_message||'暂无消息')+'</div></div><div style="text-align:right"><div class="conv-time">'+(c.last_message_at?timeAgo(c.last_message_at):'')+'</div>'+(c.unread_count?'<div class="unread-dot" style="margin-left:auto;margin-top:4px"></div>':'')+'</div></div>';}).join('');
  }).catch(function(){});
}

function openConv(id){
  var conv=conversations.find(function(c){return c.id===id;});
  if(!conv){fetchAPI('/api/chat/conversations','POST',{userId:id}).then(function(d){conv=d.conversation;conversations.push(conv);doOpenConv(conv);}).catch(function(){showToast('失败');});return;}
  doOpenConv(conv);
}

function doOpenConv(conv){
  currentConv=conv;document.getElementById('chatPlaceholder').style.display='none';document.getElementById('chatArea').style.display='flex';
  document.getElementById('chatName').textContent=conv.other_name||'用户';document.getElementById('chatAvatar').src=conv.other_avatar||'/img/default-avatar.png';
  if(window.innerWidth<768)document.getElementById('sidebar').classList.add('hidden');
  if(socket&&socket.connected)socket.emit('mark_read',{conversationId:conv.id});
  loadMsgs();loadConvs();
}

function loadMsgs(){
  fetchAPI('/api/chat/conversations/'+currentConv.id+'/messages').then(function(d){
    var c=document.getElementById('messages');c.innerHTML='';
    if(!d.messages.length){c.innerHTML='<div class="date-sep"><span>开始聊天吧</span></div>';}
    else{var last='';d.messages.forEach(function(m){var dt=new Date(m.created_at+'Z').toLocaleDateString('zh-CN');if(dt!==last){last=dt;c.innerHTML+='<div class="date-sep"><span>'+dt+'</span></div>';}appendMsg(m);});}
    scrollBottom();
  }).catch(function(){});
}

function appendMsg(m){
  var c=document.getElementById('messages');var isSent=m.sender_id===USER.id;
  var div=document.createElement('div');div.className='msg '+(isSent?'sent':'recv');
  var time=new Date(m.created_at+'Z').toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  div.innerHTML='<div><div class="msg-bubble">'+esc(m.content)+'</div><div class="msg-time">'+time+'</div></div>';
  c.appendChild(div);scrollBottom();
}

function sendMsg(){
  var input=document.getElementById('msgInput'),content=input.value.trim();
  if(!content||!currentConv)return;
  if(socket&&socket.connected){socket.emit('send_message',{conversationId:currentConv.id,content:content,type:'text'});}
  else{fetchAPI('/api/chat/conversations/'+currentConv.id+'/messages','POST',{content:content}).then(function(d){appendMsg(d.message);scrollBottom();}).catch(function(){showToast('发送失败');});}
  input.value='';
}

function scrollBottom(){var c=document.getElementById('messages');c.scrollTop=c.scrollHeight;}
function backToList(){document.getElementById('sidebar').classList.remove('hidden');document.getElementById('chatArea').style.display='none';document.getElementById('chatPlaceholder').style.display='flex';currentConv=null;}

function fetchAPI(url,method,data){return new Promise(function(resolve,reject){var h={'Content-Type':'application/json'};if(TOKEN)h['Authorization']='Bearer '+TOKEN;var r=new XMLHttpRequest();r.open(method||'GET',url,true);r.setRequestHeader('Content-Type','application/json');if(TOKEN)r.setRequestHeader('Authorization','Bearer '+TOKEN);r.onreadystatechange=function(){if(r.readyState===4){try{var d=JSON.parse(r.responseText);if(r.status>=200&&r.status<300)resolve(d);else reject(new Error(d.error||'失败'));}catch(e){reject(e);}}};r.onerror=function(){reject(new Error('网络错误'));};r.send(data?JSON.stringify(data):null);});}

function esc(s){if(!s)return '';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function timeAgo(s){var d=new Date(s+(s.indexOf('Z')>=0?'':'Z')),diff=Math.floor((Date.now()-d)/1000);if(diff<60)return'刚刚';if(diff<3600)return Math.floor(diff/60)+'分钟前';if(diff<86400)return Math.floor(diff/3600)+'小时前';if(diff<2592000)return Math.floor(diff/86400)+'天前';return Math.floor(diff/2592000)+'个月前';}
function showToast(m){var t=document.createElement('div');t.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.95);padding:10px 20px;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,0.1);z-index:999;font-size:13px';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove();},3000);}
</script></body></html>
